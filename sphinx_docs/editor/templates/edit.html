<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editing {{ filename }} - LeRobot Doc Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <style>
        .container { margin-top: 30px; max-width: 1200px; }
        .editor-toolbar { background: white; }
        .CodeMirror { height: 60vh; }
        .btn-save { padding: 10px 40px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Editing {{ filename }}</li>
          </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Editing: <code>{{ filename }}</code></h2>
            <div>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                <button type="submit" form="edit-form" class="btn btn-primary btn-save">Save & Rebuild</button>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form id="edit-form" method="POST">
            <textarea id="markdown-editor" name="content">{{ content }}</textarea>
        </form>
    </div>

    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <script>
        const easyMDE = new EasyMDE({
            element: document.getElementById('markdown-editor'),
            spellChecker: false,
            autosave: {
                enabled: true,
                uniqueId: "editor-{{ filename }}",
                delay: 1000,
            },
            toolbar: [
                "bold", "italic", "heading", "|", 
                "quote", "unordered-list", "ordered-list", "|", 
                "link", "image", "table", "|", 
                "preview", "side-by-side", "fullscreen", "|", 
                "guide"
            ],
            sideBySideFullscreen: false,
        });
    </script>
</body>
</html>
